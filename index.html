<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0f1117">
<title>СПУТНИК · Russe depuis zéro</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Спутник">
<style>
:root{
  --bg:#0e1016; --bg2:#141824; --card:#1a1f2e; --card2:#222839;
  --ink:#eceefb; --mut:#9aa3bd; --dim:#6b7495;
  --red:#e23b4e; --red2:#ff5566; --gold:#f0c04a; --grn:#3ecf8e; --blu:#5aa0ff;
  --line:#2a3145; --shadow:0 8px 30px rgba(0,0,0,.4);
  --r:16px; --r2:12px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(1200px 500px at 50% -10%, #1a2036 0%, var(--bg) 55%);
  color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  min-height:100vh; -webkit-font-smoothing:antialiased;
}
#app{max-width:560px; margin:0 auto; padding:0 14px calc(90px + env(safe-area-inset-bottom)); }

/* ---------- Header ---------- */
#hdr{position:sticky; top:0; z-index:40; display:flex; align-items:center; justify-content:space-between;
  padding:14px 4px 12px; background:linear-gradient(180deg, var(--bg) 70%, transparent); backdrop-filter:blur(6px);}
.logo{font-weight:900; letter-spacing:2px; font-size:20px; background:linear-gradient(90deg,var(--red2),var(--gold)); -webkit-background-clip:text; background-clip:text; color:transparent}
.sub{font-size:11px; color:var(--mut); margin-top:1px}
.hright{display:flex; gap:8px; align-items:center}
.streak{background:var(--card); border:1px solid var(--line); padding:5px 10px; border-radius:20px; font-weight:700; font-size:13px}
.xp{background:linear-gradient(90deg,var(--red),#b32636); padding:5px 11px; border-radius:20px; font-weight:800; font-size:13px}

/* ---------- Nav ---------- */
#nav{position:fixed; left:0; right:0; bottom:0; z-index:50; display:flex; justify-content:center; gap:2px;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom)); background:rgba(14,16,22,.92); backdrop-filter:blur(12px); border-top:1px solid var(--line)}
.navbtn{flex:1; max-width:100px; background:none; border:0; color:var(--dim); display:flex; flex-direction:column; align-items:center; gap:3px; padding:4px; font-size:10px; font-weight:600; cursor:pointer}
.navbtn .nic{font-size:20px; filter:grayscale(.4) opacity(.7); transition:.15s}
.navbtn.active{color:var(--ink)}
.navbtn.active .nic{filter:none; transform:translateY(-1px)}

/* ---------- Cards & generic ---------- */
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:15px; margin:12px 0; box-shadow:var(--shadow)}
.card-h{font-weight:800; font-size:15px; margin-bottom:10px}
.page-h{padding:6px 2px 2px}
.page-h h2{margin:6px 0 4px; font-size:24px; letter-spacing:.5px}
.lead{color:var(--mut); font-size:13.5px; line-height:1.5; margin:0}
.foot{color:var(--dim); font-size:12.5px; text-align:center; margin:18px 6px; line-height:1.5}

button{font-family:inherit}
.primary{background:linear-gradient(90deg,var(--red),#c22a3c); color:#fff; border:0; padding:13px 18px; border-radius:var(--r2); font-weight:800; font-size:15px; cursor:pointer; box-shadow:0 6px 18px rgba(226,59,78,.35)}
.ghost{background:var(--card2); color:var(--ink); border:1px solid var(--line); padding:11px 14px; border-radius:var(--r2); font-weight:700; font-size:14px; cursor:pointer}
.ghost.sm{padding:6px 10px; font-size:12px}
.full{width:100%; margin-top:10px; display:block}
.primary:active,.ghost:active{transform:scale(.98)}

/* ---------- Home ---------- */
.hero{background:linear-gradient(135deg,#241628,#2a1b2e 40%,#182033); border:1px solid var(--line); border-radius:var(--r); padding:20px 18px; margin:12px 0; position:relative; overflow:hidden}
.hero:before{content:"🛰️"; position:absolute; right:-6px; top:-10px; font-size:80px; opacity:.10; transform:rotate(-12deg)}
.hero-title{font-size:22px; font-weight:900; letter-spacing:.3px}
.hero-sub{color:var(--mut); font-size:13px; line-height:1.5; margin:6px 0 14px}
.big-cta{width:100%; background:linear-gradient(90deg,var(--red2),var(--gold)); color:#181008; border:0; padding:15px; border-radius:var(--r2); font-weight:900; font-size:16px; cursor:pointer; box-shadow:0 8px 24px rgba(240,192,74,.25)}
.cta-note{font-weight:700; opacity:.7; font-size:12px}

.lvlcard{background:var(--card); border:1px solid var(--line); border-radius:var(--r2); padding:12px 14px; margin:12px 0}
.lvlrow{display:flex; justify-content:space-between; font-size:13px; color:var(--mut); margin-bottom:8px}
.lvlrow b{color:var(--ink)}
.pbar{height:9px; background:#0e1220; border-radius:6px; overflow:hidden}
.pbar.big{height:11px}
.pbar i{display:block; height:100%; background:linear-gradient(90deg,var(--gold),var(--red2)); border-radius:6px; transition:width .5s}

.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:12px 0}
.stat{background:var(--card); border:1px solid var(--line); border-radius:var(--r2); padding:14px; text-align:center}
.stat.hot{border-color:var(--red); box-shadow:0 0 0 1px rgba(226,59,78,.3)}
.snum{font-size:26px; font-weight:900}
.slab{font-size:11.5px; color:var(--mut); margin-top:2px}

.quests{display:flex; flex-direction:column; gap:9px}
.quest{display:grid; grid-template-columns:auto 1fr auto; grid-template-areas:"c t x" "c b x"; gap:2px 9px; align-items:center; background:var(--card2); border:1px solid var(--line); border-radius:var(--r2); padding:9px 12px}
.quest.qdone{opacity:.6}
.qcheck{grid-area:c; font-size:17px}
.qtxt{grid-area:t; font-size:13.5px; font-weight:600}
.qbar{grid-area:b; height:5px; background:#0e1220; border-radius:4px; overflow:hidden; margin-top:3px}
.qbar i{display:block; height:100%; background:var(--grn)}
.qxp{grid-area:x; font-size:12px; font-weight:800; color:var(--gold)}

.quicks{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.quick{background:var(--card2); border:1px solid var(--line); border-radius:var(--r2); padding:14px 10px; color:var(--ink); font-weight:700; font-size:14px; cursor:pointer; display:flex; flex-direction:column; gap:3px; align-items:flex-start}
.quick small{color:var(--mut); font-weight:500; font-size:11px}

/* ---------- Alphabet ---------- */
.progwrap{display:flex; align-items:center; gap:10px; margin:12px 0 4px}
.progwrap span{font-size:12px; color:var(--mut); white-space:nowrap}
.grp-h{display:flex; align-items:center; gap:11px; margin-bottom:12px}
.grp-n{width:30px; height:30px; flex:none; border-radius:9px; background:linear-gradient(135deg,var(--red),var(--gold)); color:#1a1208; display:grid; place-items:center; font-weight:900}
.grp-h b{font-size:15px}
.grp-h small{display:block; color:var(--mut); font-size:11.5px; line-height:1.4; margin-top:2px}
.letters{display:grid; grid-template-columns:repeat(auto-fill,minmax(64px,1fr)); gap:8px; margin-bottom:12px}
.lcell{position:relative; background:var(--card2); border:1px solid var(--line); border-radius:var(--r2); padding:10px 4px 8px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:2px; color:var(--ink)}
.lcell:active{transform:scale(.95)}
.lseen{border-color:var(--blu)}
.lok{border-color:var(--grn); background:linear-gradient(180deg,rgba(62,207,142,.12),var(--card2))}
.lch{font-size:20px; font-weight:800}
.ltr{font-size:12px; color:var(--gold); font-weight:700}
.lwarn{position:absolute; top:4px; right:6px; color:var(--red2); font-weight:900; font-size:12px}

/* letter modal */
.lmodal{text-align:center}
.lbig{font-size:64px; font-weight:900; line-height:1.1; background:linear-gradient(180deg,#fff,var(--gold)); -webkit-background-clip:text; background-clip:text; color:transparent}
.lbig.big{font-size:44px}
.lname{color:var(--gold); font-weight:800; font-size:17px; margin-top:2px}
.lson{color:var(--mut); font-size:14px; margin-top:6px; line-height:1.5}
.piege{background:rgba(226,59,78,.13); border:1px solid rgba(226,59,78,.4); color:#ffb3bc; padding:8px 12px; border-radius:10px; font-size:13px; margin:12px 0; line-height:1.45}
.lex{background:var(--card2); border:1px solid var(--line); border-radius:12px; padding:12px; margin:14px 0; display:flex; flex-direction:column; gap:3px; cursor:pointer; position:relative}
.lex-ru{font-size:22px; font-weight:800}
.lex-fr{font-size:13px; color:var(--mut)}
.lex-spk{position:absolute; right:12px; top:12px; font-size:20px}
.lbtns{display:flex; gap:10px; margin-top:6px}
.lbtns .primary,.lbtns .ghost{flex:1}

/* ---------- Cours ---------- */
.acc{background:var(--card2); border:1px solid var(--line); border-radius:var(--r2); margin:9px 0; overflow:hidden}
.acc>summary{padding:13px 14px; font-weight:700; font-size:14.5px; cursor:pointer; list-style:none; display:flex; align-items:center; gap:8px}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary:after{content:"＋"; margin-left:auto; color:var(--dim); font-weight:800}
.acc[open]>summary:after{content:"−"}
.acc[open]>summary{border-bottom:1px solid var(--line); background:rgba(240,192,74,.05)}
.acc-body{padding:13px 14px}
.acc-body p{margin:0 0 11px; font-size:14px; line-height:1.6; color:#dfe3f4}
.tip{background:rgba(90,160,255,.1); border-left:3px solid var(--blu); padding:9px 12px; border-radius:8px; font-size:13.5px; line-height:1.5; margin:9px 0; color:#cfe0ff}
.exlist{display:flex; flex-direction:column; gap:8px; margin:10px 0}
.exrow{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; cursor:pointer}
.ex-ru{font-size:16px; font-weight:700; display:block}
.ex-tr{font-size:12.5px; color:var(--gold); display:block; margin:1px 0}
.ex-fr{font-size:13px; color:var(--mut); display:block}
.mini-spk{background:none; border:0; font-size:15px; cursor:pointer; padding:0 2px}
.tblwrap{overflow-x:auto; margin:10px 0; border-radius:10px; border:1px solid var(--line)}
table{border-collapse:collapse; width:100%; font-size:13px; min-width:340px}
th,td{padding:9px 11px; text-align:left; border-bottom:1px solid var(--line)}
th{background:var(--card); color:var(--gold); font-size:12px; text-transform:uppercase; letter-spacing:.5px}
td{color:#dfe3f4}
tr:last-child td{border-bottom:0}

/* ---------- Lexique ---------- */
.seg{display:flex; gap:6px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:4px; margin:12px 0}
.seg button{flex:1; background:none; border:0; color:var(--mut); padding:9px; border-radius:9px; font-weight:700; font-size:13.5px; cursor:pointer}
.seg button.on{background:var(--red); color:#fff}
.lex-h{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px}
.lex-h b{font-size:15px}
.lex-note{font-size:11.5px; color:var(--dim); margin-top:8px; text-align:right}
.wlist{display:flex; flex-direction:column; gap:7px}
.wrow{display:flex; align-items:center; gap:10px; background:var(--card2); border:1px solid var(--line); border-radius:11px; padding:9px 11px}
.wspk{background:none; border:0; font-size:19px; cursor:pointer; flex:none; padding:2px}
.wmid{flex:none; min-width:38%}
.wru{font-size:16.5px; font-weight:700}
.wtr{font-size:11.5px; color:var(--gold)}
.wfr{flex:1; font-size:13.5px; color:var(--mut); text-align:right}
.wadd{flex:none; width:32px; height:32px; border-radius:9px; background:var(--card); border:1px solid var(--line); color:var(--gold); font-size:17px; font-weight:800; cursor:pointer}
.wadd.in{background:var(--grn); color:#08130d; border-color:var(--grn)}

/* ---------- Exos hub ---------- */
.exgrid{display:flex; flex-direction:column; gap:11px; margin-top:8px}
.excard{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:16px; text-align:left; cursor:pointer; display:grid; grid-template-columns:auto 1fr; grid-template-rows:auto auto; column-gap:14px; align-items:center; color:var(--ink)}
.excard:active{transform:scale(.99)}
.exic{grid-row:1/3; font-size:30px}
.excard b{font-size:15.5px}
.excard small{color:var(--mut); font-size:12.5px}

/* ---------- Screens (exos/séance) ---------- */
.xbar{display:flex; align-items:center; justify-content:space-between; padding:14px 2px; position:sticky; top:0; background:var(--bg); z-index:20}
.xbar b{font-size:15px}
.xback{background:var(--card2); border:1px solid var(--line); color:var(--ink); width:34px; height:34px; border-radius:10px; font-size:16px; cursor:pointer}
.sstep{font-size:12px; color:var(--mut); min-width:34px; text-align:right}
.sbar{height:5px; background:#0e1220; border-radius:4px; overflow:hidden; margin-bottom:8px}
.sbar i{display:block; height:100%; background:linear-gradient(90deg,var(--gold),var(--red2)); transition:width .4s}

.quiz,.flash,.translit,.match,.sess,.result{padding:8px 2px}
.qprog,.fprog{color:var(--mut); font-size:12.5px; text-align:center; margin-bottom:14px}
.qbig{font-size:80px; font-weight:900; text-align:center; line-height:1; margin:6px 0; background:linear-gradient(180deg,#fff,var(--gold)); -webkit-background-clip:text; background-clip:text; color:transparent}
.qask{text-align:center; color:var(--mut); font-size:14px; margin-bottom:16px}
.qopts{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.qopt{background:var(--card2); border:1px solid var(--line); border-radius:12px; padding:14px 8px; cursor:pointer; color:var(--ink); display:flex; flex-direction:column; gap:2px}
.qopt b{font-size:20px}
.qopt small{font-size:10.5px; color:var(--mut)}
.qopt.good{background:var(--grn); color:#08130d; border-color:var(--grn)}
.qopt.good small{color:#0a2016}
.qopt.bad{background:var(--red); color:#fff; border-color:var(--red)}

/* flash / séance */
.stag{text-align:center; color:var(--gold); font-weight:800; font-size:12.5px; text-transform:uppercase; letter-spacing:1px; margin-bottom:14px}
.fcard{background:var(--card2); border:1px solid var(--line); border-radius:var(--r); padding:34px 18px; text-align:center; cursor:pointer; min-height:150px; display:flex; flex-direction:column; justify-content:center; gap:10px}
.fru{font-size:34px; font-weight:900}
.fru.big{font-size:38px}
.ftr{font-size:16px; color:var(--gold); font-weight:700}
.ffr{font-size:17px; color:var(--ink)}
.fhint{color:var(--dim); font-size:13px}
.grades{display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:8px; margin-top:14px}
.grade{border:0; border-radius:11px; padding:14px 4px; font-weight:800; font-size:13px; cursor:pointer; color:#fff}
.g0{background:#b3303f} .g3{background:#c47a1e} .g4{background:#2f8f6a} .g5{background:#2b7d3f}

/* translit / dictée */
.tprompt{text-align:center; margin-bottom:14px}
.tfr{font-size:22px; font-weight:800}
.ttr{font-size:14px; color:var(--gold)}
.tin{width:100%; background:var(--card); border:2px solid var(--line); border-radius:12px; padding:15px; font-size:24px; color:var(--ink); text-align:center; font-weight:700; letter-spacing:1px}
.tin:focus{outline:none; border-color:var(--gold)}
.tfeed{min-height:26px; text-align:center; margin:10px 0; font-size:15px}
.tfeed .ok{color:var(--grn); font-weight:700} .tfeed .ko{color:var(--red2); font-weight:700}
.dhint{text-align:center; color:var(--mut); font-size:15px; margin:6px 0 10px}
.hearbig{width:100%; background:var(--card2); border:1px solid var(--line); color:var(--ink); border-radius:12px; padding:20px; font-size:18px; font-weight:800; cursor:pointer; margin-bottom:6px}

/* clavier cyrillique */
.kbd{margin:14px 0 10px; display:flex; flex-direction:column; gap:6px}
.krow{display:flex; gap:5px; justify-content:center}
.key{flex:1; min-width:0; background:var(--card2); border:1px solid var(--line); color:var(--ink); border-radius:8px; padding:12px 2px; font-size:17px; font-weight:600; cursor:pointer}
.key:active{background:var(--gold); color:#181008}
.key.wide{flex:4; font-size:13px; color:var(--mut)}
.key.del{flex:1.6}

/* match */
.matchhint{text-align:center; color:var(--mut); font-size:13.5px; margin-bottom:14px}
.mcols{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.mcol{display:flex; flex-direction:column; gap:8px}
.mcell{background:var(--card2); border:1px solid var(--line); border-radius:11px; padding:15px 8px; font-size:15px; font-weight:600; color:var(--ink); cursor:pointer; min-height:52px}
.mru{font-weight:800; font-size:17px}
.mcell.sel{border-color:var(--gold); background:rgba(240,192,74,.15)}
.mcell.bad{border-color:var(--red); animation:shake .3s}
.mcell.mdone{opacity:.35; pointer-events:none; border-color:var(--grn)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* result / closer */
.result{text-align:center; padding:30px 14px}
.rbig{font-size:64px; margin-bottom:6px}
.rscore{font-size:34px; font-weight:900; background:linear-gradient(90deg,var(--gold),var(--red2)); -webkit-background-clip:text; background-clip:text; color:transparent}
.result p{color:var(--mut); font-size:14.5px; line-height:1.6; margin:12px auto 20px; max-width:340px}
.result .primary,.result .ghost{margin:6px auto; min-width:180px; display:block}
.closer .closer-msg{color:var(--ink)}
.closer-cmd{color:var(--gold)!important; font-weight:700; font-style:italic}

/* ---------- Modal ---------- */
#modal{position:fixed; inset:0; z-index:100; display:none; align-items:center; justify-content:center; padding:20px}
#modal.show{display:flex}
.modal-back{position:absolute; inset:0; background:rgba(6,8,14,.7); backdrop-filter:blur(3px)}
.modal-box{position:relative; background:var(--card); border:1px solid var(--line); border-radius:20px; padding:22px; width:100%; max-width:380px; box-shadow:var(--shadow); animation:pop .2s}
@keyframes pop{from{transform:scale(.9); opacity:0}to{transform:scale(1); opacity:1}}

/* ---------- Toast ---------- */
#toast{position:fixed; bottom:calc(84px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%) translateY(20px); background:#000d; border:1px solid var(--line); color:#fff; padding:11px 18px; border-radius:24px; font-weight:700; font-size:14px; z-index:200; opacity:0; transition:.25s; pointer-events:none; white-space:nowrap}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
  <div id="app">
    <header id="hdr"></header>
    <main id="view"></main>
  </div>
  <nav id="nav"></nav>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
